# Copy to config.yaml and fill in your details (never commit config.yaml).

vault:
  base_url: https://theabcvault.com
  middleware_api: https://abc.irishtitan.cloud
  email: you@example.com
  password: your-abc-password
  vault_key: VAULT-KEY-FROM-INVITATION-EMAIL
  # Optional: preferred pickup store code (see retail locations on the site)
  store_id: null

monitor:
  shop_url: https://theabcvault.com/shop/
  poll_interval_seconds: 3
  poll_jitter_seconds: 1.5
  # Substring match against product titles (case-insensitive); any keyword can match
  keywords:
    - "Old Forester Birthday"
    - "Michter's"
    - "Blanton"
  auto_add_to_cart: true
  stop_after_cart: true

notifications:
  console: true
  # Desktop toast on Windows (requires optional: pip install win10toast)
  desktop: false
  telegram:
    enabled: false
    bot_token: ""
    chat_id: ""
  webhook:
    enabled: false
    url: ""
