# Copy to config.yaml and fill in your details (never share or commit config.yaml).

vault:
  email: you@example.com
  password: your-abc-password
  vault_key: VAULT-KEY-FROM-INVITATION-EMAIL

monitor:
  poll_interval_seconds: 3
  poll_jitter_seconds: 1.5
  # Match bottle titles (case-insensitive); any keyword can match
  keywords:
    - "Old Forester Birthday"
    - "Michter's"
    - "Blanton"
  # Set false for a test run (alerts only, no cart)
  auto_add_to_cart: true
  stop_after_cart: true

notifications:
  console: true
  # Desktop alert: Windows (pip install win10toast) or Mac (built-in)
  desktop: false
  discord:
    enabled: true
    # Channel webhook URL — see SETUP.md for how to create one
    webhook_url: "https://discord.com/api/webhooks/..."
